<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斌 · 星际漫游</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #000;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== Stars ===== */
  #stars-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  /* ===== Nebula ===== */
  .nebula {
    position: fixed; border-radius: 50%;
    filter: blur(120px); pointer-events: none;
    z-index: 0;
  }
  .nebula:nth-child(1) {
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(74,0,224,0.12), transparent);
    top: -200px; left: -200px;
    animation: drift 30s infinite ease-in-out;
  }
  .nebula:nth-child(2) {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(142,45,226,0.08), transparent);
    bottom: -150px; right: -100px;
    animation: drift 25s infinite ease-in-out reverse;
  }
  .nebula:nth-child(3) {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,210,255,0.06), transparent);
    top: 50%; left: 10%;
    animation: drift 35s infinite ease-in-out;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(100px, -80px); }
    66% { transform: translate(-60px, 120px); }
  }

  /* ===== Hero ===== */
  .hero {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center;
  }

  /* ===== Avatar ===== */
  .avatar-wrap {
    width: 120px; height: 120px;
    margin: 0 auto 28px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  .avatar-ring {
    position: absolute;
    top: -6px; left: -6px;
    width: 132px; height: 132px;
    border-radius: 50%;
    border: 1px solid rgba(74,0,224,0.3);
    animation: orbit-1 4s linear infinite;
  }
  .avatar-ring:nth-child(2) {
    top: -12px; left: -12px;
    width: 144px; height: 144px;
    border: 1px dashed rgba(142,45,226,0.2);
    animation: orbit-1 7s linear infinite reverse;
  }
  .avatar-ring:nth-child(3) {
    top: -18px; left: -18px;
    width: 156px; height: 156px;
    border: 1px solid rgba(0,210,255,0.15);
    animation: orbit-1 10s linear infinite;
  }

  @keyframes orbit-1 {
    to { transform: rotate(360deg); }
  }

  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 600;
    background: linear-gradient(135deg, rgba(74,0,224,0.3), rgba(142,45,226,0.2));
    border: 1px solid rgba(74,0,224,0.3);
    box-shadow: 0 0 60px rgba(74,0,224,0.15);
    color: white;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(4px);
  }

  /* ===== Title ===== */
  .hero h1 {
    font-size: 48px;
    font-weight: 200;
    letter-spacing: 14px;
    text-transform: uppercase;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #7c4dff, #b388ff, #00bcd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero .subtitle {
    font-size: 13px;
    color: #555;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 300;
  }

  .hero .coord {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #333;
    margin-bottom: 32px;
    letter-spacing: 2px;
  }

  /* ===== Tags ===== */
  .tags {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 40px;
  }
  .tags span {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    color: #555;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    letter-spacing: 1px;
  }

  /* ===== Cards ===== */
  .links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }

  .card {
    padding: 20px 12px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    text-decoration: none;
    color: #888;
    transition: all 0.4s ease;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #7c4dff, #00bcd4);
    transition: width 0.4s;
  }

  .card:hover::after { width: 80%; }

  .card:hover {
    border-color: rgba(124,77,255,0.3);
    background: rgba(124,77,255,0.06);
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 60px rgba(74,0,224,0.15);
    color: #e0e0e0;
  }

  .card .icon { font-size: 28px; display: block; }
  .card .label { font-size: 12px; font-weight: 500; letter-spacing: 2px; }
  .card .hint { font-size: 10px; color: #444; }
  .card:hover .hint { color: #666; }

  .card.coming { opacity: 0.4; }
  .card.coming:hover { transform: none; box-shadow: none; border-color: rgba(255,255,255,0.06); color: #888; }
  .card.coming:hover::after { width: 0; }

  /* ===== Footer ===== */
  .footer {
    position: relative; z-index: 1;
    text-align: center; padding: 40px 20px 32px;
    font-size: 11px; color: #222;
    letter-spacing: 3px;
  }
  .footer a { color: #333; text-decoration: none; transition: color 0.3s; }
  .footer a:hover { color: #7c4dff; }
  .footer .social { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
  .footer .social a { font-size: 16px; opacity: 0.3; transition: opacity 0.3s; }
  .footer .social a:hover { opacity: 0.8; }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .hero h1 { font-size: 28px; letter-spacing: 8px; }
    .links { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { padding: 16px 10px; }
  }
</style>

<script>
  // Animated starfield with canvas
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Create stars
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.2,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.02,
      speed: Math.random() * 0.15 + 0.02,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0.1) s.da *= -1;
      s.y -= s.speed;
      if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
</script>
