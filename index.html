<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #111;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ===== Subtle gradient ===== */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(100,100,120,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(80,80,100,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== Horizontal line ===== */
  .accent-line {
    position: fixed;
    top: 50%; left: 0;
    width: 100%; height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.04), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
  }

  /* ===== Avatar ===== */
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 28px;
    font-weight: 300;
    margin: 0 auto 32px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #ccc;
    letter-spacing: 2px;
    transition: border-color 0.5s ease;
  }
  .avatar:hover { border-color: #444; }

  /* ===== Typography ===== */
  .subtitle-top {
    font-size: 12px;
    color: #555;
    letter-spacing: 4px;
    font-weight: 300;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 36px;
    font-weight: 200;
    letter-spacing: 6px;
    color: #e0e0e0;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: #555;
    letter-spacing: 3px;
    font-weight: 300;
    margin-bottom: 8px;
  }

  .divider {
    width: 32px;
    height: 1px;
    background: #333;
    margin: 20px auto;
  }

  .desc {
    font-size: 13px;
    color: #555;
    line-height: 2;
    font-weight: 300;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }

  /* ===== Links ===== */
  .links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  .link {
    padding: 14px 28px;
    text-decoration: none;
    color: #666;
    font-size: 13px;
    letter-spacing: 3px;
    transition: all 0.4s ease;
    border: 1px solid #1a1a1a;
    font-weight: 300;
    min-width: 120px;
    flex: 1;
  }

  .link:first-child { border-radius: 8px 0 0 8px; }
  .link:last-child { border-radius: 0 8px 8px 0; }
  .link:not(:last-child) { border-right: none; }

  .link:hover {
    color: #e0e0e0;
    border-color: #333;
    background: rgba(255,255,255,0.02);
  }

  .link .icon { display: block; font-size: 20px; margin-bottom: 4px; }
  .link .label { display: block; }
  .link .status {
    display: block;
    font-size: 10px;
    color: #333;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .link:hover .status { color: #555; }

  .link.coming { opacity: 0.4; cursor: default; }
  .link.coming:hover { color: #666; border-color: #1a1a1a; background: none; }

  /* ===== Footer ===== */
  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: #2a2a2a;
    letter-spacing: 2px;
  }
  .footer a {
    color: #333;
    text-decoration: none;
    transition: color 0.3s;
  }
  .footer a:hover { color: #666; }
  .footer .social { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .footer .social a { font-size: 14px; opacity: 0.3; transition: opacity 0.3s; }
  .footer .social a:hover { opacity: 0.6; }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    h1 { font-size: 26px; letter-spacing: 4px; }
    .link { min-width: 50%; flex: none; padding: 12px 20px; }
    .link:first-child { border-radius: 8px 8px 0 0; }
    .link:last-child { border-radius: 0 0 8px 8px; }
    .link:not(:last-child) { border-right: 1px solid #1a1a1a; border-bottom: none; }
    .links { flex-direction: column; align-items: stretch; max-width: 280px; margin: 0 auto; }
  }
</style>
