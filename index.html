<!DOCTYPE html>
<html lang="zh-cn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斌的个人主页</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --card-hover: rgba(255,255,255,0.12);
    --text: #e0e0e0;
    --text-dim: rgba(255,255,255,0.5);
    --accent: #667eea;
    --accent2: #764ba2;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-anim {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; overflow: hidden;
    pointer-events: none;
  }
  .bg-anim span {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.15;
    animation: float 20s infinite ease-in-out;
  }
  .bg-anim span:nth-child(1) { width: 600px; height: 600px; background: #667eea; top: -200px; left: -200px; animation-delay: 0s; }
  .bg-anim span:nth-child(2) { width: 500px; height: 500px; background: #764ba2; bottom: -150px; right: -150px; animation-delay: -7s; }
  .bg-anim span:nth-child(3) { width: 400px; height: 400px; background: #f093fb; top: 50%; left: 50%; animation-delay: -14s; }

  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(100px,-80px) scale(1.1); }
    50% { transform: translate(-60px,120px) scale(0.9); }
    75% { transform: translate(80px,60px) scale(1.05); }
  }

  .hero {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center;
  }

  .avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(102,126,234,0.3);
    animation: pulse 3s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(102,126,234,0.3); }
    50% { box-shadow: 0 0 60px rgba(102,126,234,0.5); }
  }

  .hero h1 {
    font-size: 42px; font-weight: 800;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px; letter-spacing: 1px;
  }

  .hero p { font-size: 16px; color: var(--text-dim); margin-bottom: 6px; }

  .hero .tags {
    display: flex; gap: 12px; margin-top: 16px;
    flex-wrap: wrap; justify-content: center;
  }
  .hero .tags span {
    padding: 4px 14px; border-radius: 20px; font-size: 12px;
    background: rgba(255,255,255,0.06);
    color: var(--text-dim); border: 1px solid rgba(255,255,255,0.08);
  }

  .links {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px; max-width: 560px;
    margin: -40px auto 60px; padding: 0 20px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 16px; padding: 24px;
    text-decoration: none; color: var(--text);
    transition: all 0.3s ease;
    display: flex; align-items: center; gap: 16px;
    position: relative; overflow: hidden;
  }

  .card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.05));
    opacity: 0; transition: opacity 0.3s;
  }

  .card:hover { background: var(--card-hover); transform: translateY(-4px); border-color: rgba(102,126,234,0.3); }
  .card:hover::before { opacity: 1; }
  .card:hover .card-arrow { transform: translateX(4px); color: var(--accent); }

  .card-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; position: relative; z-index: 1;
  }
  .card-icon.blog { background: rgba(102,126,234,0.2); }
  .card-icon.drive { background: rgba(118,75,162,0.2); }
  .card-icon.app { background: rgba(240,147,251,0.2); }
  .card-icon.tool { background: rgba(72,202,228,0.2); }

  .card-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .card-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .card-info p { font-size: 12px; color: var(--text-dim); }

  .card-arrow { font-size: 18px; color: var(--text-dim); position: relative; z-index: 1; transition: transform 0.3s; }

  .card.coming-soon { opacity: 0.5; cursor: default; }
  .card.coming-soon:hover { transform: none; background: var(--card-bg); }

  .footer { position: relative; z-index: 1; text-align: center; padding: 0 20px 40px; font-size: 13px; color: var(--text-dim); }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer .social { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .footer .social a { width: 40px; height: 40px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.3s; }
  .footer .social a:hover { background: var(--card-hover); transform: translateY(-2px); }

  @media (max-width: 480px) {
    .hero h1 { font-size: 28px; }
    .links { grid-template-columns: 1fr; }
    .card { padding: 18px; }
  }
</style>
</head>
